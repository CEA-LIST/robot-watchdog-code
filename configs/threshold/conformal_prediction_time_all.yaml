# Time-varying conformal band (Diquigiovanni et al., 2021), computed for every alpha of `alpha_all`
# and for both modulation functions (s1 = "variant1", s2 = "variant2").
name: conformal_prediction_time_all

# h is the empirical (1 - alpha)-quantile of the maximum normalised deviation on D_B
alpha_all: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 0.99]
split_rate: 0.40 # fraction of the calibration set used as D_A (band shape), the rest is D_B (band width)
