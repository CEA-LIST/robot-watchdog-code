[project]
name = "robot-watchdog"
version = "1.0.0"
description = "Robot-WATCHDOG: failure detection through object-centric graph representation (CoRL 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "Quentin Rolland" }]
dependencies = [
    "torch==2.6.0",
    "torch-geometric==2.7.0",
    "numpy==1.26.4",
    "scipy==1.15.2",
    "scikit-learn==1.7.2",
    "numba==0.64.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "pandas==2.2.3",
    "tqdm==4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robot_watchdog"]
